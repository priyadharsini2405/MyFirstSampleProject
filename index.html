<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff8f0;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h2 {
      background: #ff7043;
      color: white;
      padding: 15px;
      margin: 0;
    }

    .menu-container {
      margin: 20px auto;
      max-width: 500px;
    }

    /* Category buttons */
    .menu-category {
      margin: 10px;
      padding: 12px 20px;
      background: #ffe0b2;
      color: #333;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      display: block;
      width: 100%;
      transition: background 0.3s;
    }
    .menu-category:hover {
      background: #ffcc80;
    }

    /* Dish sections */
    .dishes {
      display: none;
      margin: 15px 0;
      text-align: left;
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .dishes h3 {
      margin-top: 0;
      color: #ff7043;
    }

    .dish {
      margin: 8px 0;
      padding: 8px;
      border-bottom: 1px solid #eee;
    }

    .dish:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

<h2>🍴 Restaurant Menu</h2>

<div class="menu-container">
  <!-- Category Buttons -->
  <button class="menu-category" onclick="showDishes('veg')">🥗 Veg</button>
  <button class="menu-category" onclick="showDishes('nonveg')">🍗 Non-Veg</button>
  <button class="menu-category" onclick="showDishes('starter')">🥟 Starters</button>
  <button class="menu-category" onclick="showDishes('dessert')">🍨 Desserts</button>

  <!-- Dish Lists -->
  <div id="veg" class="dishes">
    <h3>Veg Dishes</h3>
    <div class="dish">Paneer Butter Masala</div>
    <div class="dish">Veg Biryani</div>
    <div class="dish">Aloo Gobi</div>
  </div>

  <div id="nonveg" class="dishes">
    <h3>Non-Veg Dishes</h3>
    <div class="dish">Chicken Curry</div>
    <div class="dish">Mutton Biryani</div>
    <div class="dish">Fish Fry</div>
  </div>

  <div id="starter" class="dishes">
    <h3>Starters</h3>
    <div class="dish">Spring Rolls</div>
    <div class="dish">Paneer Tikka</div>
    <div class="dish">Chicken Lollipop</div>
  </div>

  <div id="dessert" class="dishes">
    <h3>Desserts</h3>
    <div class="dish">Ice Cream Varieties</div>
    <div class="dish">Fresh Juices</div>
    <div class="dish">Brownie with Ice Cream</div>
  </div>
</div>

<script>
  function showDishes(category) {
    // Hide all dish sections
    var allDishes = document.getElementsByClassName("dishes");
    for (var i = 0; i < allDishes.length; i++) {
      allDishes[i].style.display = "none";
    }
    // Show the selected category
    document.getElementById(category).style.display = "block";
  }
</script>

</body>
</html>
