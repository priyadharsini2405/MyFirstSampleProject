<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Priya Menu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #d35400;
    }
    .menu {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .item {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 18px;
    }
    .price {
      font-weight: bold;
      color: #27ae60;
    }
  </style>
</head>
<body>
  <h1>🍲 Hotel Priya Menu 🍲</h1>

  <div class="menu">
    <div class="item"><span>Idli (2 pcs)</span><span class="price">₹40</span></div>
    <div class="item"><span>Dosa</span><span class="price">₹50</span></div>
    <div class="item"><span>Pongal</span><span class="price">₹60</span></div>
    <div class="item"><span>Vada (2 pcs)</span><span class="price">₹30</span></div>
    <div class="item"><span>Meals</span><span class="price">₹120</span></div>
  </div>

  <p style="margin-top:20px;">Scan QR again anytime to view menu online ✅</p>
</body>
</html>
